<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family History Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-style='italic' font-size='17' fill='%23fff' text-anchor='middle'%3Efh%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-timeline" viewBox="0 0 24 24"><circle cx="5" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="5" cy="18" r="1.6" fill="currentColor" stroke="none"/><path d="M9.5 6H20M9.5 12H20M9.5 18H16"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1.2"/><rect x="3" y="16" width="6" height="5" rx="1.2"/><rect x="15" y="16" width="6" height="5" rx="1.2"/><path d="M12 8v4M6 16v-4h12v4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4L12 4Z"/><path d="M12 10v4"/><circle cx="12" cy="16.8" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5 7 20l3.5-3.5M17 20V4M13.5 7.5 17 4l3.5 3.5"/></symbol>
    <symbol id="i-rings" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.5c1.6.9 2.7 2.9 3 5.5"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><path d="M12 4v6M12 10 6 20M12 10l6 10"/></symbol>
    <symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4l6 10v6M18 4l-6 10"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
  </defs>
</svg>

<div class="ambient" aria-hidden="true"></div>

<div class="app">
  <nav class="rail" aria-label="Navegação principal">
    <div class="brand" title="Family History Search">fh</div>
    <button class="rail-btn is-active" data-view="timeline" aria-label="Linha do tempo">
      <svg class="icon"><use href="#i-timeline"/></svg><span class="rail-tip">Linha do tempo</span>
    </button>
    <button class="rail-btn" data-view="tree" aria-label="Árvore de parentesco">
      <svg class="icon"><use href="#i-tree"/></svg><span class="rail-tip">Árvore</span>
    </button>
    <button class="rail-btn" data-view="people" aria-label="Pessoas">
      <svg class="icon"><use href="#i-people"/></svg><span class="rail-tip">Pessoas</span>
    </button>
    <span class="rail-sep"></span>
    <button class="rail-btn" data-action="new-search" aria-label="Nova busca">
      <svg class="icon"><use href="#i-plus"/></svg><span class="rail-tip">Nova busca</span>
    </button>
  </nav>

  <div class="shell">
    <header class="topbar">
      <label class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="Buscar pessoa, lugar ou trecho" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="topbar-right">
        <button id="search-indicator" class="indicator" data-action="show-search" hidden>
          <span class="pulse"></span><span id="search-indicator-text"></span>
        </button>
        <div class="picker" id="picker">
          <button type="button" class="picker-btn" id="picker-btn" aria-haspopup="listbox" aria-expanded="false"
                  aria-controls="picker-menu" disabled>
            <span class="picker-label">Busca</span>
            <span class="picker-value" id="picker-value">—</span>
            <svg class="icon picker-chevron"><use href="#i-chevron"/></svg>
          </button>
          <div class="picker-menu" id="picker-menu" hidden>
            <div class="picker-filter" id="picker-filter" hidden>
              <svg class="icon"><use href="#i-search"/></svg>
              <input id="picker-q" type="search" placeholder="Filtrar buscas" autocomplete="off"
                     aria-label="Filtrar buscas" aria-controls="picker-list">
            </div>
            <p class="picker-heading">Últimas buscas</p>
            <div class="picker-list" id="picker-list" role="listbox" aria-label="Últimas buscas" tabindex="-1"></div>
            <button type="button" class="picker-new" data-action="new-search">
              <svg class="icon"><use href="#i-plus"/></svg>Nova busca
            </button>
          </div>
        </div>
        <button class="btn btn-primary" data-action="new-search">
          <svg class="icon"><use href="#i-plus"/></svg>Nova busca
        </button>
      </div>
    </header>

    <main class="main">
      <section class="page-head">
        <p class="eyebrow" id="eyebrow">Hemeroteca Digital Brasileira</p>
        <h1 id="title">Carregando</h1>
        <dl class="stats" id="stats"></dl>
      </section>

      <section id="view-timeline" class="view">
        <div class="filters">
          <div class="seg" id="f-event" role="group" aria-label="Tipo de evento"></div>
          <div class="seg" id="f-status" role="group" aria-label="Revisão"></div>
          <select id="f-periodical" class="select" aria-label="Periódico"></select>
          <button id="f-sort" class="btn btn-ghost" type="button">
            <svg class="icon"><use href="#i-sort"/></svg><span>Mais antigo primeiro</span>
          </button>
          <span class="spacer"></span>
          <span class="export">
            <span class="export-label">Aprovados</span>
            <a class="btn btn-ghost btn-sm" id="export-csv" download><svg class="icon"><use href="#i-download"/></svg>CSV</a>
            <a class="btn btn-ghost btn-sm" id="export-json" download><svg class="icon"><use href="#i-download"/></svg>JSON</a>
          </span>
        </div>
        <p class="result-count" id="result-count"></p>
        <div class="timeline" id="timeline"></div>
        <div class="more"><button id="more" class="btn btn-ghost" type="button" hidden>Mostrar mais</button></div>
        <div class="empty" id="timeline-empty" hidden></div>
      </section>

      <section id="view-tree" class="view" hidden>
        <div class="tree-bar">
          <div class="legend">
            <span><i class="ln ln-solid"></i>Confirmada</span>
            <span><i class="ln ln-dashed"></i>Hipótese</span>
            <span><i class="ln ln-flag"></i>Conflito</span>
            <span><i class="dot dot-surname"></i>Leva o sobrenome</span>
          </div>
          <button id="tree-flags" class="flag-note" type="button" hidden>
            <svg class="icon"><use href="#i-alert"/></svg><span></span>
          </button>
          <span class="spacer"></span>
          <div class="zoom" role="group" aria-label="Zoom">
            <button class="icon-btn" data-zoom="-1" aria-label="Diminuir"><svg class="icon"><use href="#i-minus"/></svg></button>
            <span id="zoom-level">100%</span>
            <button class="icon-btn" data-zoom="1" aria-label="Aumentar"><svg class="icon"><use href="#i-plus"/></svg></button>
            <button class="icon-btn" data-zoom="fit" aria-label="Ver a árvore inteira" title="Ver a árvore inteira"><svg class="icon"><use href="#i-fit"/></svg></button>
          </div>
        </div>
        <div class="tree-viewport" id="tree-viewport"><div class="tree-stage" id="tree-stage"></div></div>
        <div class="empty" id="tree-empty" hidden></div>
      </section>

      <section id="view-people" class="view" hidden>
        <div class="filters">
          <p class="people-summary" id="people-summary"></p>
          <span class="spacer"></span>
          <div class="seg" id="people-sort" role="group" aria-label="Ordenar pessoas">
            <button type="button" data-psort="mentions" aria-pressed="true">Mais citadas</button>
            <button type="button" data-psort="name" aria-pressed="false">A–Z</button>
            <button type="button" data-psort="year" aria-pressed="false">Mais antigas</button>
          </div>
        </div>
        <div class="people-grid" id="people-grid"></div>
        <div class="empty" id="people-empty" hidden></div>
      </section>

      <footer class="foot">
        Fonte: Hemeroteca Digital Brasileira, Fundação Biblioteca Nacional. Relações e agrupamentos são hipóteses até serem revisados.
      </footer>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
  <header class="drawer-head">
    <div>
      <p class="eyebrow" id="drawer-eyebrow"></p>
      <h2 id="drawer-title"></h2>
    </div>
    <button class="icon-btn" data-action="close-drawer" aria-label="Fechar"><svg class="icon"><use href="#i-x"/></svg></button>
  </header>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/static/tree.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
